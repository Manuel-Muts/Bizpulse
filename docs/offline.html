<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#123c56" />
  <title>Offline - BizPulse</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    body { display: grid; min-height: 100vh; place-items: center; box-sizing: border-box; }
    main { width: min(100% - 32px, 480px); padding: 28px; border: 1px solid #dbeafe; border-radius: 20px; background: #fff; box-shadow: 0 18px 48px rgba(15, 23, 42, .12); text-align: center; }
    h1 { color: #1e3a8a; }
    p { color: #475569; line-height: 1.6; }
    a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; margin-top: 12px; padding: 0 18px; border-radius: 10px; background: #1d4ed8; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>You’re offline</h1>
    <p>Reconnect to the internet to sign in and sync your business information. This offline screen does not show account details.</p>
    <a href="/clients">Try again</a>
  </main>
</body>
</html>
